trigger: none
pr: none

variables:
  # Docker image which is used to build and test "virtual" platform https://aka.ms/obpipelines/containers
  LinuxContainerImage: 'mcr.microsoft.com/onebranch/azurelinux/build:3.0' # implicit default but otherwise could be set like => target: 'linux_build_container'
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
  PIP_INDEX_URL: https://github-private.pkgs.visualstudio.com/_packaging/accl-cts-ccf-external-dependencies/pypi/simple/

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
  parameters:
    globalSdl: # https://aka.ms/obpipelines/sdl
      perStage:
        sdl_sources:
          checkout_all_repos: true
      tsa:
        enabled: false
      policheck:
        break: true
    release:
      category: NonAzure
    stages:
    - stage: build
      jobs:
      - job: pyscitt
        displayName: Build pyscitt
        pool:
          type: linux
        variables:
          ob_outputDirectory: $(Build.SourcesDirectory)/pyscitt/dist
        steps:
        # checkout options docs https://eng.ms/docs/products/onebranch/build/containerbasedworkflow/gitcloneoptions
        - checkout: self
          path: s/
          submodules: recursive
          fetchTags: true
          fetchDepth: 0
          lfs: false
        - script: |
            echo "LinuxContainerImage ${{ variables.LinuxContainerImage }}"
          displayName: Print variables
        - template: /.pipelines/ado_pipauth.yml@self
        - script: |
            python3 -m pip install --upgrade pip
            python3 -m pip install build
            cd pyscitt
            python3 -m build
          displayName: Build distribution artifacts

    - stage: release
      dependsOn: build
      variables:
      - name: ob_release_environment
        value: Production # should be  Test, PPE or Production
      jobs:
      - job: pypi
        displayName: Release pyscitt 
        pool:
          type: release
        templateContext:
          type: releaseJob  # Required, this indicates this job is a release job
          isProduction: true  # Required, must be 'true' or 'false'
          inputs:  # All input build artifacts must be declared here
          - input: pipelineArtifact  # Required, type of the input artifact
            artifactName: drop_build_pyscitt  # Required, name of the pipeline artifact
        steps:
        # Docs and examples of setting up releases:
        # - https://microsoft.sharepoint.com/teams/prss/release/
        # - https://eng.ms/docs/microsoft-security/identity/trust-and-security-services/tss-high-security-environments/tss-esrp-fabric-and-platform-services/esrp-documentation/tsgs/sfi/tsg506-integrating-esrp-release-ado-extension
        # - https://eng.ms/docs/products/onebranch/release/yamlreleasepipelines/templatesandexamples/boxproducts/esrprelease
        # the input artifact is flattened straight into $(Pipeline.Workspace), which also holds _manifest and s,
        # so copy only the distributions out; ESRP zips everything under folderlocation
        - task: CopyFiles@2
          displayName: Stage distributions for ESRP
          inputs:
            sourceFolder: $(Pipeline.Workspace)
            contents: |
              *.whl
              *.tar.gz
            targetFolder: $(Pipeline.Workspace)/esrp_dist
        - task: EsrpRelease@10
          displayName: ESRP Release to PyPi
          inputs:
            connectedservicename: accl-cts-esrp-codesign # Service connection that has access to the subscription and certs
            usemanagedidentity: false # Our ESRP registration is mapped to the app registration and NOT the managed identity
            keyvaultname: accl-shared-kv # Key vault that stores the signing certificate 
            signcertname: ACL-CTS-ESRP-REQUESTSIGN # Name of the sign certificate in above key vault
            authcertname: ACL-CTS-ESRP-AUTH # authentication certificate name in AKV
            clientid: 208e0740-1909-4945-80a6-8a4cf3103a24 # ESPR Client Id
            contenttype: pypi # Should be maven, pypi or npm depending on which package you are publishing
            intent: PackageDistribution
            waitforreleasecompletion: true
            folderlocation: '$(Pipeline.Workspace)/esrp_dist' # path to the folder which contains package to publish. This should be a path to the package and not the file.
            owners: 'iprudnikovas@microsoft.com,andrea.piccione@microsoft.com,musabbirkhan@microsoft.com,pallabpaul@microsoft.com' # alias of an owner. owner and approver should be different. sg's and dl's are not supported.
            approvers: 'settiy@microsoft.com,bhkrishn@microsoft.com' # alias of an approver, this is auto approved on behalf of this user, recommendation in docs is that it should be EM
            mainpublisher: ESRPRELPACMAN # Should be your main publisher value, provided at the time of ESRP Release onboarding. Please reachout to esrprelpm@microsoft.com if you don't know this.
            domaintenantid: 33e01921-4d64-4f8c-a055-5bdaffd5e33d # Should the one of 975f013f-7f24-47e8-a7d3-abc4752bf346 (PME), 33e01921-4d64-4f8c-a055-5bdaffd5e33d (AME) and cdc5aeea-15c5-4db6-b079-fcadd2505dc2 (Torus) 
