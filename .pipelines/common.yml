# Stages shared by pullrequest.yml and official.yml
parameters:
- name: IsOfficialBuild
  type: boolean
  default: false
- name: AcrName # registry the image is pushed to
  type: string
- name: AcrEndpoint
  type: string

stages:
- stage: setup
  jobs:
  - job: setup
    pool:
      type: linux
    variables:
      ob_outputDirectory: '$(Build.SourcesDirectory)/out' # this directory is uploaded to pipeline artifacts, reddog and cloudvault. More info at https://aka.ms/obpipelines/artifacts
    steps:
    - task: onebranch.pipeline.version@1 # generates automatic version. For other versioning options check https://aka.ms/obpipelines/versioning
      displayName: Setup BuildNumber
      inputs:
        system: 'Patch'
        major: '1'
        minor: '0'
        # consumers deploy only images marked official, i.e. release tag builds; match the
        # '-official-<sha8>' suffix, since the ref part of the tag can contain 'official'
        ${{ if not(parameters.IsOfficialBuild) }}:
          tag: pr
        ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}:
          tag: official
        ${{ else }}:
          tag: ci
        name: scitt-ccf-ledger
    - script: |
        echo "SCITT_CI $(SCITT_CI)"
        echo "gitTagOrCommit $(gitTagOrCommit)"
        echo "LinuxContainerImage $(LinuxContainerImage)"
      displayName: Print variables

- stage: build
  jobs:
  - job: test
    displayName: Build and test
    # specific available images already set in the parent config
    # implicitly target container is linux_build_container
    # if you want to use a different container, you need to set it in at job/script level
    pool:
      type: linux
      # the steps below will implicitly use "target: linux_build_container"
    variables:
      ob_outputDirectory: $(Build.SourcesDirectory)/out
    steps:
      # checkout options docs https://eng.ms/docs/products/onebranch/build/containerbasedworkflow/gitcloneoptions
      - checkout: self
        path: s/
        submodules: recursive
        fetchTags: true
        fetchDepth: 0
        lfs: false
      # first, so no script can install Python packages from public PyPI
      - template: /.pipelines/ado_pipauth.yml@self
      - script: ./scripts/setup-env.sh
        displayName: Setup environment
      - script: ./build.sh
        displayName: Build (local)
      - script: ./run_functional_tests.sh
        displayName: Run Functional Tests

  - job: test_docker
    displayName: Build and test with Docker
    pool:
      type: linux
      isCustom: true
      name: ado-scitt-pool
    variables:
      ob_outputDirectory: $(Build.SourcesDirectory)/out
    steps:
      - checkout: self
        path: s/
        submodules: recursive
        fetchTags: true
        fetchDepth: 0
        lfs: false
      # first, so no script can install Python packages from public PyPI
      - template: /.pipelines/ado_pipauth.yml@self
      - script: ./docker/build.sh
        displayName: Build with Docker
      - script: ./run_functional_tests.sh
        displayName: Run Functional Tests
        env:
          DOCKER: 1
          ELEVATE_PRIVILEGES: true

- stage: docker
  dependsOn:
  - setup
  # official images wait for the tests; PR images build early to get the merge commit GitHub Actions built
  - ${{ if parameters.IsOfficialBuild }}:
    - build
  jobs:
  - template: /.pipelines/obpdocker.yml@self
    parameters:
      Name: scitt
      DisplayName: Build Docker image
      # the build number carries the official/ci/pr marker set in the setup stage
      DockerTag: $(gitTagOrCommit)_$(Build.BuildNumber)
      AcrName: ${{ parameters.AcrName }}
      DockerFile: Dockerfile
      AcrEndpoint: ${{ parameters.AcrEndpoint }}

- ${{ if parameters.IsOfficialBuild }}:
  # import the prod images into staging so both ACRs hold identical images
  - stage: sync_prod_to_staging
    dependsOn:
    - docker
    jobs:
    - job: import_images
      variables:
        ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      pool:
        type: linux
        isCustom: true
        name: ado-scitt-pool
      steps:
      - checkout: self
        path: s/
        clean: true
      - task: onebranch.pipeline.containercontrol@1
        displayName: "Login to Staging ACR"
        inputs:
          command: login
          acr_name: confidentialledgeracrstaging
          endpoint: acl-acr-staging-2
      - task: onebranch.pipeline.containercontrol@1
        displayName: "Login to Prod ACR"
        inputs:
          command: login
          acr_name: confidentialledgeracrprod
          endpoint: acl-acr-prod-federated3
      - task: DownloadPipelineArtifact@2
        displayName: 'Download image metadata files'
        inputs:
          buildType: current
          targetPath: $(Build.SourcesDirectory)/dst
          patterns: |
            drop_docker_*/**/*-metadata.json
      - task: CopyFiles@2
        displayName: 'Copy image metadata to target folder'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)/dst'
          flattenFolders: true
          # failed job attempts publish drop_docker_<job>_failed_<attempt>, which can hold a superseded image
          Contents: |
            **/*-metadata.json
            !drop_docker_*_failed_*/**
          TargetFolder: '$(Build.SourcesDirectory)/image-metadata'
          CleanTargetFolder: true
      - task: AzureCLI@2
        displayName: 'Get access token for the production ACR'
        inputs:
          azureSubscription: acl-prod-github-private-azure-conn
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            set -euo pipefail
            access_token=$(az account get-access-token --query accessToken -o tsv --only-show-errors)
            echo "##vso[task.setvariable variable=prodAccessToken;isReadOnly=true;issecret=true]$access_token"
      - task: AzureCLI@2
        displayName: 'Export image rootfs diff IDs'
        inputs:
          azureSubscription: acl-prod-github-private-azure-conn
          scriptType: 'bash'
          scriptLocation: 'scriptPath'
          scriptPath: "$(Build.SourcesDirectory)/.pipelines/scripts/export-image-rootfs-diff-ids.sh"
      - task: AzureCLI@2
        displayName: 'Import docker images to staging ACR'
        inputs:
          azureSubscription: acl-staging-github-private-azure-conn
          scriptType: 'bash'
          scriptLocation: 'scriptPath'
          scriptPath: "$(Build.SourcesDirectory)/.pipelines/scripts/import-acr-images.sh"
          arguments: "confidentialledgeracrstaging $(prodAccessToken)"
