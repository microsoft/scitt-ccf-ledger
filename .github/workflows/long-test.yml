name: Long Test

on:
  # Verified: fuzz-api job is gated only by `contains(github.event.pull_request.labels.*.name, 'run-fuzz-test')`
  # (line 56). Because the workflow triggers on synchronize, any commit pushed after the label is applied re-runs
  # the job on the unreviewed PR head, executing PR-controlled `./scripts/setup-env.sh`, `./build.sh` (lines 68-70)
  # and `./run_fuzz_tests.sh` (line 76) as root on the self-hosted gha-scitt-pool. Distinct label and sink from the
  # long-asan job — independently exploitable.
  # Same-repository PRs rerun automatically while labeled. Fork PRs require
  # re-applying the matching label after reviewing each new revision.
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
      - reopened
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

jobs:
  long-asan:
    name: ASAN
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'pull_request' &&
          ((github.event.action == 'labeled' && github.event.label.name == 'run-long-test') ||
           (github.event.action != 'labeled' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'run-long-test'))))
      }}
    # 1ES creates a runner for each queued job and removes it when that job ends.
    # The unique JobId label makes sure only that job can use it.
    runs-on: [self-hosted, 1ES.Pool=gha-scitt-pool, "JobId=long-asan-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"]
    container: mcr.microsoft.com/azurelinux/base/core:3.0
    env:
      # Fast unwinder only gives us partial stack traces in LeakSanitzer
      # Alloc/dealloc mismatch has been disabled in CCF: https://github.com/microsoft/CCF/pull/5157
      ASAN_OPTIONS: fast_unwind_on_malloc=0:alloc_dealloc_mismatch=0
      CMAKE_BUILD_TYPE: Debug
      BUILD_DEBUG_CCF_FROM_SOURCE: ON
    steps:
      - name: Setup environment
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss build-essential ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Freeze the event's merge commit rather than a moving PR ref.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build
        run: |
          ./scripts/setup-env.sh
          ./build.sh
      
      - name: E2E tests
        run: |
          set +x
          ./run_functional_tests.sh

      - name: "Upload logs"
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-asan
          path: |
            /tmp/pytest-of-root/*current/*current/*.{out,err}
            /tmp/pytest-of-root/*current/*current/config.json
          if-no-files-found: warn
  fuzz-api:
    name: fuzz
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'pull_request' &&
          ((github.event.action == 'labeled' && github.event.label.name == 'run-fuzz-test') ||
           (github.event.action != 'labeled' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'run-fuzz-test'))))
      }}
    runs-on: [self-hosted, 1ES.Pool=gha-scitt-pool, "JobId=fuzz-api-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"]
    container: mcr.microsoft.com/azurelinux/base/core:3.0
    steps:
      - name: Setup environment
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss build-essential ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Freeze the event's merge commit rather than a moving PR ref.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build
        run: |
          ./scripts/setup-env.sh
          ./build.sh
      
      - name: Fuzz tests
        run: |
          set +x
          ./run_fuzz_tests.sh 2>&1 > fuzz.log
          echo "Preview test output:"
          grep -A 1 -B 20 "Number of tests" fuzz.log

      - name: "Upload logs"
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boofuzz-results
          path: |
            fuzz.log
          if-no-files-found: warn
