name: "Build and test"
on:
  push:
    branches:
      - main
      - feat/github-oidc-e2e
  pull_request:
    # 'labeled' is needed so that adding the run-test-on-mult-nodes label to an
    # open pull request triggers the multi-node job below.
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format and License Checks
    runs-on: [self-hosted, 1ES.Pool=gha-scitt-pool]
    container: mcr.microsoft.com/azurelinux/base/core:3.0
    steps:
      - run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss build-essential ca-certificates git
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/setup-env.sh
      - run: ./scripts/ci-checks.sh
  build-test:
    name: CI
    needs: checks
    runs-on: [self-hosted, 1ES.Pool=gha-scitt-pool]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root --publish-all --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_PTRACE -v /lib/modules:/lib/modules:ro
      env:
        # Helps to distinguish between CI and local builds.
        SCITT_CI: 1
        # Additional CMake flags.
        ENABLE_CLANG_TIDY: ON
        ENABLE_DOTNET_TESTS: 1
    steps:
      - name: Setup environment
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss build-essential ca-certificates git
      - name: Checkout repository with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Work-around for https://github.com/actions/runner/issues/2033
      - name: Work around git safe.directory in container
        run: chown -R $(id -u):$(id -g) $PWD

      - run: ./scripts/setup-env.sh
      - run: ./build.sh
      - name: Package ledger for temporary Fulcio probe
        id: temporary_ledger_rpm
        if: >-
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/feat/github-oidc-e2e') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.head_ref == 'feat/github-oidc-e2e')
        working-directory: app/build/app
        run: |
          tdnf install -y rpm-build
          cpack -G RPM -B "$RUNNER_TEMP/github-oidc-ledger-rpm"
      - name: Share ledger build with temporary Fulcio probe
        if: steps.temporary_ledger_rpm.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-oidc-ledger-rpm
          path: ${{ runner.temp }}/github-oidc-ledger-rpm/*.rpm
          retention-days: 1
          if-no-files-found: error
      - name: Install dotnet test dependencies
        run: |
          tdnf install -y dotnet-sdk-8.0.x86_64
      - run: ./run_functional_tests.sh
      - name: "Upload logs"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: logs
          path: |
            /tmp/pytest-of-root/*current/*current/*.{out,err}
            /tmp/pytest-of-root/*current/*current/config.json
          if-no-files-found: warn

  temporary-github-oidc-fulcio:
    name: Temporary GitHub OIDC/Fulcio ledger check
    # Remove this feature-branch probe after live ledger validation.
    needs: build-test
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feat/github-oidc-e2e') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feat/github-oidc-e2e')
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/azurelinux/base/core:3.0
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up runtime environment
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss ca-certificates git python3-pip
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the CI-built ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-oidc-ledger-rpm
          path: ${{ runner.temp }}/github-oidc-ledger-rpm
      - name: Install ledger and test dependencies
        run: |
          tdnf install -y "$RUNNER_TEMP/github-oidc-ledger-rpm/"*.rpm
          python3.12 -m venv "$RUNNER_TEMP/scitt-fulcio-venv"
          "$RUNNER_TEMP/scitt-fulcio-venv/bin/python" -m pip install \
            --disable-pip-version-check --quiet ./pyscitt -r test/requirements.txt
      - name: "Temporary: submit a real Fulcio-backed statement to a local ledger"
        env:
          SCITT_LIVE_GITHUB_OIDC: "1"
          SCITT_GITHUB_OIDC_OUTPUT_DIR: ${{ runner.temp }}/github-oidc-ledger-output
        run: |
          "$RUNNER_TEMP/scitt-fulcio-venv/bin/python" -m pytest -v -s --tb=short \
            --start-cchost \
            --cchost-binary=/opt/scitt/bin/cchost \
            --constitution=/opt/scitt/share/scitt/constitution \
            test/test_github_oidc_live.py
      - name: Retain the signed statement and verified registration receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-oidc-fulcio-cose
          path: |
            ${{ runner.temp }}/github-oidc-ledger-output/signed-statement.cose
            ${{ runner.temp }}/github-oidc-ledger-output/transparent-statement.cose
            ${{ runner.temp }}/github-oidc-ledger-output/submission.json
          retention-days: 1
          if-no-files-found: error

  build-test-multi-node:
    name: CI (3 node cluster)
    needs: checks
    # Running a cluster is a lot more expensive than a single node, so it is
    # opt-in: label the pull request with run-test-on-mult-nodes, or trigger the
    # workflow manually.
    if: ${{ contains(github.event.pull_request.labels.*.name, 'run-test-on-mult-nodes') || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, 1ES.Pool=gha-scitt-pool]
    env:
      SCITT_CI: 1
      # Run the tests against a cluster fronted by a round robin load balancer,
      # rather than against a single node.
      DOCKER: 1
      NODE_COUNT: 3
      # Puts the sibling containers in this container's network namespace, so
      # that the load balancer is reachable on localhost from the tests.
      DOCKER_IN_DOCKER: 1
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      # The nodes and the load balancer run as sibling containers, started
      # through the host's Docker daemon.
      options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Setup environment
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          # Only the Docker client is needed, as the daemon is the host's one.
          # docker/build.sh builds with BuildKit, which requires the buildx CLI
          # plugin. The application itself is built into the image, so none of
          # the CCF build dependencies are required here.
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss \
            ca-certificates docker-buildx git hostname jq moby-cli openssl \
            python3-pip tar
      - name: Checkout repository with tags
        uses: actions/checkout@v7
        with:
          # docker/build.sh derives the image version with git describe.
          fetch-depth: 0

      # Work-around for https://github.com/actions/runner/issues/2033
      - name: Work around git safe.directory in container
        run: |
          chown -R $(id -u):$(id -g) $PWD
          git config --global --add safe.directory $PWD

      - name: Build the image
        run: ./docker/build.sh
      - name: Run functional tests against a ${{ env.NODE_COUNT }} node cluster
        run: ./run_functional_tests.sh
      - name: "Upload logs"
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: logs-multi-node
          path: |
            /tmp/pytest-of-root/*current/*current/*.{out,err}
            /tmp/pytest-of-root/*current/*current/config.json
          if-no-files-found: warn
