name: "Performance Regression Tests"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
      # TEMPORARY: seed perf-bench-main history before merging. Remove.
      - achamayou-ccf-style-benchmark-ci
  workflow_dispatch:

permissions: read-all

# Each run extends the perf history restored from the previous run's artifact,
# so runs on the same branch must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  run_benchmarks:
    name: Run benchmarks
    uses: ./.github/workflows/benchmark-run.yml

  perf_history:
    name: Performance history
    needs: run_benchmarks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bencher-results
          path: results
        continue-on-error: true

      - name: Update perf history
        run: |
          set -ex
          branch="${GITHUB_REF_NAME}"
          # TEMPORARY: seed perf-bench-main history before merging. Remove.
          if [[ "$branch" == "achamayou-ccf-style-benchmark-ci" ]]; then
            branch=main
          fi
          artifact="perf-bench-${branch//\//-}"
          echo "PERF_HISTORY_ARTIFACT=${artifact}" >> "$GITHUB_ENV"
          ./scripts/perf-history.sh restore "$artifact" perf
          ./scripts/perf-history.sh add results/bencher.json perf
          ./scripts/perf-history.sh trim perf 180
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summarise perf history
        run: python3 scripts/perf_summary.py perf >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PERF_HISTORY_ARTIFACT }}
          path: perf
          if-no-files-found: ignore
