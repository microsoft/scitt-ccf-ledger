name: Sign and submit to SCITT
description: Sign a file with a GitHub OIDC-backed ephemeral key and register it in SCITT

inputs:
  file:
    description: File whose exact bytes are embedded in the signed statement
    required: true
  ledger-url:
    description: HTTPS URL of the configured, running SCITT ledger
    required: true
  content-type:
    description: COSE payload content type
    default: application/octet-stream
  service-ca:
    description: Optional PEM CA bundle for ledger TLS verification
    default: ""
  output-dir:
    description: Directory for signed and transparent statements
    default: scitt-output

outputs:
  transaction-id:
    description: Committed SCITT transaction ID
    value: ${{ steps.verify.outputs.transaction-id }}
  signed-statement:
    description: Absolute path to the COSE signed statement
    value: ${{ steps.verify.outputs.signed-statement }}
  transparent-statement:
    description: Absolute path to the COSE statement with its verified ledger receipt
    value: ${{ steps.verify.outputs.transparent-statement }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Prepare isolated pyscitt environment
      id: setup
      shell: bash
      run: |
        venv_dir="$(mktemp -d "${RUNNER_TEMP}/scitt-sign.XXXXXX")"
        python -m venv "$venv_dir"
        "$venv_dir/bin/python" -m pip install --disable-pip-version-check --quiet \
          "${GITHUB_ACTION_PATH}/../../../pyscitt"
        echo "python=$venv_dir/bin/python" >> "$GITHUB_OUTPUT"
        echo "scitt=$venv_dir/bin/scitt" >> "$GITHUB_OUTPUT"
    - name: Sign the input file with GitHub OIDC and Fulcio
      shell: bash
      env:
        SCITT_CLI: ${{ steps.setup.outputs.scitt }}
        SCITT_PYTHON: ${{ steps.setup.outputs.python }}
        SCITT_FILE: ${{ inputs.file }}
        SCITT_LEDGER_URL: ${{ inputs.ledger-url }}
        SCITT_CONTENT_TYPE: ${{ inputs.content-type }}
        SCITT_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        "$SCITT_PYTHON" - <<'PY'
        import os
        from urllib.parse import urlsplit

        url = urlsplit(os.environ["SCITT_LEDGER_URL"])
        if (url.scheme != "https" or not url.hostname or url.username is not None
            or url.password is not None or url.fragment):
            raise ValueError("Ledger URL must use HTTPS without credentials or fragment")
        output_dir = os.environ["SCITT_OUTPUT_DIR"]
        if "\n" in output_dir or "\r" in output_dir:
            raise ValueError("Action output paths must not contain newlines")
        PY
        "$SCITT_CLI" sign-gha-fulcio \
          --statement="$SCITT_FILE" \
          --content-type="$SCITT_CONTENT_TYPE" \
          --out="$SCITT_OUTPUT_DIR/signed-statement.cose"
    - name: Register the signed statement
      id: submit
      shell: bash
      env:
        SCITT_CLI: ${{ steps.setup.outputs.scitt }}
        SCITT_LEDGER_URL: ${{ inputs.ledger-url }}
        SCITT_SERVICE_CA: ${{ inputs.service-ca }}
        SCITT_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        client_args=(--url "$SCITT_LEDGER_URL")
        if [ -n "$SCITT_SERVICE_CA" ]; then
          client_args+=("--cacert=$SCITT_SERVICE_CA")
        fi
        "$SCITT_CLI" submit \
          "${client_args[@]}" \
          --transparent-statement="$SCITT_OUTPUT_DIR/transparent-statement.cose" \
          -- "$SCITT_OUTPUT_DIR/signed-statement.cose"
    - name: Verify the transparent statement and report registration details
      id: verify
      shell: bash
      env:
        SCITT_CLI: ${{ steps.setup.outputs.scitt }}
        SCITT_PYTHON: ${{ steps.setup.outputs.python }}
        SCITT_LEDGER_URL: ${{ inputs.ledger-url }}
        SCITT_SERVICE_CA: ${{ inputs.service-ca }}
        SCITT_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        trust_store_dir="$(mktemp -d "${RUNNER_TEMP}/scitt-trust.XXXXXX")"
        trap 'rm -f -- "$trust_store_dir/scitt-keys.cbor"; rmdir -- "$trust_store_dir"' EXIT
        SCITT_TRUST_STORE="$trust_store_dir" "$SCITT_PYTHON" - <<'PY'
        import os
        from pathlib import Path

        import cbor2
        from pyscitt.client import Client

        client = Client(
            os.environ["SCITT_LEDGER_URL"],
            cacert=os.environ["SCITT_SERVICE_CA"] or None,
        )
        try:
            keys = client.get_scitt_keys()
        finally:
            client.session.close()
        (Path(os.environ["SCITT_TRUST_STORE"]) / "scitt-keys.cbor").write_bytes(
            cbor2.dumps(keys)
        )
        PY
        verification="$("$SCITT_CLI" validate \
          --service-trust-store="$trust_store_dir" \
          --offline --output=json -- "$SCITT_OUTPUT_DIR/transparent-statement.cose")" || {
          status=$?
          printf '%s\n' "$verification"
          exit "$status"
        }
        printf '%s\n' "$verification"
        SCITT_VERIFICATION="$verification" "$SCITT_PYTHON" - <<'PY'
        import json
        import os
        import re
        from pathlib import Path

        result = json.loads(os.environ["SCITT_VERIFICATION"])
        if not isinstance(result, dict) or result.get("transparent") is not True:
            raise ValueError("The statement was not verified as transparent")
        receipts = result.get("receipts")
        if (not isinstance(receipts, list) or len(receipts) != 1
            or not isinstance(receipts[0], dict)):
            raise ValueError("Expected one verified ledger receipt")
        receipt = receipts[0]
        transaction_id = receipt.get("registration_txid")
        if (not isinstance(transaction_id, str)
            or not re.fullmatch(r"[0-9]+\.[0-9]+", transaction_id)):
            raise ValueError("Verification output has an invalid registration transaction ID")
        directory = Path(os.environ["SCITT_OUTPUT_DIR"])
        outputs = {
            "transaction-id": transaction_id,
            "signed-statement": str((directory / "signed-statement.cose").resolve()),
            "transparent-statement": str((directory / "transparent-statement.cose").resolve()),
        }
        if any(not isinstance(value, str) or "\n" in value or "\r" in value
               for value in outputs.values()):
            raise ValueError("Action outputs must not contain newlines")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
            for name, value in outputs.items():
                stream.write(f"{name}={value}\n")
        PY
